name: Upgrade menu 1 2 3
# kick
on:
  push:
    paths:
      - '.github/workflows/upgrade-menu-once.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ordering search and polished cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')

          css='''
          /* v3: search, polished cards, messenger ordering */
          .search-row{display:grid;grid-template-columns:minmax(240px,1fr) auto;gap:12px;align-items:end;margin:22px 0 14px}
          .search-box{position:relative}.search-box .magnify{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.7}
          .menu-search{width:100%;height:50px;border:1px solid var(--line);border-radius:15px;background:#12161e;color:#fff;padding:0 46px 0 44px;outline:0}
          .menu-search:focus{border-color:rgba(243,199,66,.65);box-shadow:0 0 0 4px rgba(243,199,66,.08)}
          .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:#22262f;color:#fff;cursor:pointer}
          .result-count{color:var(--muted);font-size:14px;padding-bottom:14px;white-space:nowrap}
          .card{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;background:linear-gradient(180deg,#11141b,#0d0f14)}
          .card:hover{transform:translateY(-5px);border-color:#414754;box-shadow:0 22px 55px rgba(0,0,0,.34)}
          .photo-wrap{position:relative;overflow:hidden}.photo{transition:transform .3s ease}.card:hover .photo{transform:scale(1.04)}
          .cat-badge{position:absolute;left:12px;bottom:12px;padding:7px 10px;border-radius:999px;background:rgba(10,12,17,.84);border:1px solid rgba(255,255,255,.14);font-size:12px;font-weight:850}
          .add{box-shadow:0 10px 25px rgba(223,48,55,.2);transition:.18s}.add:hover{transform:translateY(-2px);filter:brightness(1.07)}
          .empty{grid-column:1/-1;border:1px dashed #3a404c;border-radius:20px;padding:44px 20px;text-align:center;color:var(--muted)}
          .order-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.order-action{min-height:50px;border:0;border-radius:14px;color:#fff;font-weight:950;cursor:pointer}.order-action.wa{background:#1f9d55}.order-action.tg{background:#268bd2}.order-action.copy{grid-column:1/-1;background:#22262f;border:1px solid #343a46}
          .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--gold);color:#111;padding:11px 16px;border-radius:12px;font-weight:900;opacity:0;pointer-events:none;transition:.22s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
          @media(max-width:720px){.search-row{grid-template-columns:1fr}.result-count{padding-bottom:0}}
          @media(max-width:520px){.order-actions{grid-template-columns:1fr}.order-action.copy{grid-column:auto}}
          '''
          s=s.replace('</style>',css+'\n</style>')

          old='<div class="toolbar" id="filters"></div><div class="grid" id="grid"></div>'
          new='<div class="search-row"><div class="search-box"><span class="magnify">🔎</span><input id="menuSearch" class="menu-search" placeholder="Поиск: крылья, паста, стейк..." autocomplete="off"><button id="searchClear" class="search-clear" aria-label="Очистить">×</button></div><div id="resultCount" class="result-count"></div></div><div class="toolbar" id="filters"></div><div class="grid" id="grid"></div>'
          s=s.replace(old,new)

          oldbook='<div class="book"><a class="btn" href="tel:+79010124760">📞 Забронировать стол: +7 (901) 012-47-60</a><div class="hint">Корзина помогает посчитать сумму. Заказ через сайт пока не отправляется автоматически.</div></div>'
          newbook='<div class="order-actions"><button class="order-action wa" id="waOrder">💬 Заказать в WhatsApp</button><button class="order-action tg" id="tgOrder">✈️ Отправить в Telegram</button><button class="order-action copy" id="copyOrder">📋 Скопировать заказ</button></div><div class="hint" style="margin-top:10px">WhatsApp откроет чат на номер +7 (901) 012-47-60 с готовым заказом. Telegram откроет меню «Поделиться».</div>'
          s=s.replace(oldbook,newbook)
          s=s.replace('</body>','<div class="toast" id="toast">Заказ скопирован</div>\n</body>')

          s=s.replace("const cart={}; let active='Все';","let cart=JSON.parse(localStorage.getItem('ace_cart')||'{}'); let active='Все', query='';")
          s=s.replace("const filters=document.getElementById('filters'),grid=document.getElementById('grid');","const filters=document.getElementById('filters'),grid=document.getElementById('grid'),menuSearch=document.getElementById('menuSearch'),resultCount=document.getElementById('resultCount');")

          old_render="function render(){const arr=active==='Все'?ITEMS:ITEMS.filter(x=>x.cat===active);grid.innerHTML=arr.map((x,i)=>{const idx=ITEMS.indexOf(x);const sel=x.variants?`<select class=\"variant\" id=\"v${idx}\">${x.variants.map((v,j)=>`<option value=\"${j}\">${v[0]} — ${v[1]} ₽</option>`).join('')}</select>`:'';return `<article class=\"card\"><div class=\"photo\">${x.icon}</div><div class=\"body\"><h3 class=\"name\">${x.name}</h3><div class=\"meta\"><span class=\"price\">${x.priceLabel}</span><span class=\"weight\">${x.weight}</span></div>${sel}<button class=\"add\" onclick=\"add(${idx})\">Добавить в корзину</button></div></article>`}).join('');}"
          new_render="function render(){const q=query.trim().toLocaleLowerCase('ru');const arr=ITEMS.filter(x=>(active==='Все'||x.cat===active)&&(!q||(x.name+' '+x.cat).toLocaleLowerCase('ru').includes(q)));resultCount.textContent='Найдено: '+arr.length;grid.innerHTML=arr.length?arr.map(x=>{const idx=ITEMS.indexOf(x);const sel=x.variants?`<select class=\"variant\" id=\"v${idx}\">${x.variants.map((v,j)=>`<option value=\"${j}\">${v[0]} — ${v[1]} ₽</option>`).join('')}</select>`:'';return `<article class=\"card\"><div class=\"photo-wrap\"><div class=\"photo\">${x.icon}</div><span class=\"cat-badge\">${x.cat}</span></div><div class=\"body\"><h3 class=\"name\">${x.name}</h3><div class=\"meta\"><span class=\"price\">${x.priceLabel}</span><span class=\"weight\">${x.weight}</span></div>${sel}<button class=\"add\" onclick=\"add(${idx})\">＋ Добавить в корзину</button></div></article>`}).join(''):'<div class=\"empty\">Ничего не найдено. Попробуйте другое название блюда.</div>';}"
          s=s.replace(old_render,new_render)

          s=s.replace("function renderCart(){const keys=Object.keys(cart);", "function saveCart(){localStorage.setItem('ace_cart',JSON.stringify(cart));renderCart();}\nfunction renderCart(){const keys=Object.keys(cart);")
          s=s.replace("cart[key].qty++;renderCart();}","cart[key].qty++;saveCart();}")
          s=s.replace("delete cart[key];renderCart();}","delete cart[key];saveCart();}")

          marker="document.getElementById('cartBtn').onclick="
          extra="""
function orderText(){const keys=Object.keys(cart).filter(k=>cart[k].qty>0);if(!keys.length)return '';let total=0;const lines=['Здравствуйте! Хочу сделать заказ в Спорт ACE Бар:',''];keys.forEach((k,n)=>{const c=cart[k],x=ITEMS[c.i],sum=c.price*c.qty;total+=sum;lines.push(`${n+1}. ${x.name}${c.label?' — '+c.label:''} × ${c.qty} — ${sum} ₽`)});lines.push('',`Итого: ${total} ₽`,'Адрес: Краснодар, ул. Суворова, 54');return lines.join('\\n')}
function requireOrder(){const t=orderText();if(!t){alert('Сначала добавьте блюда в корзину.');return null}return t}
document.getElementById('waOrder').onclick=()=>{const t=requireOrder();if(t)window.open('https://wa.me/79010124760?text='+encodeURIComponent(t),'_blank')};
document.getElementById('tgOrder').onclick=()=>{const t=requireOrder();if(t)window.open('https://t.me/share/url?url=&text='+encodeURIComponent(t),'_blank')};
document.getElementById('copyOrder').onclick=async()=>{const t=requireOrder();if(!t)return;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}const z=document.getElementById('toast');z.classList.add('show');setTimeout(()=>z.classList.remove('show'),1500)};
menuSearch.oninput=()=>{query=menuSearch.value;render()};document.getElementById('searchClear').onclick=()=>{menuSearch.value='';query='';render();menuSearch.focus()};
"""
          s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')

          ip=Path('index.html')
          if ip.exists():
              x=ip.read_text(encoding='utf-8')
              if '🛒 Заказать онлайн' not in x:
                  x=x.replace('<a class="btn ghost" href="menu.html">Меню</a>','<a class="btn ghost" href="menu.html">Меню</a><a class="btn ghost" href="menu.html">🛒 Заказать онлайн</a>')
              ip.write_text(x,encoding='utf-8')
          PY
          rm .github/workflows/upgrade-menu-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html index.html .github/workflows/upgrade-menu-once.yml
          git commit -m "Upgrade menu ordering search and cards"
          git push
