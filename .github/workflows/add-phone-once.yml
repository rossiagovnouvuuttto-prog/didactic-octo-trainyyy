name: Add booking phone
on:
  push:
    paths:
      - '.github/workflows/add-phone-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add booking phone to site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          phone = '+7 (901) 012-47-60'
          tel = 'tel:+79010124760'

          s = s.replace(
            '<a class="btn ghost" href="#contacts">Контакты</a>',
            f'<a class="btn ghost" href="{tel}">📞 Забронировать стол</a>'
          )

          old = '<div class="address">Краснодар,<br>ул. Суворова, 54</div><p class="muted">Ежедневно с 12:00 до 03:00.</p>'
          new = f'<div class="address">Краснодар,<br>ул. Суворова, 54</div><p class="muted">Ежедневно с 12:00 до 03:00.</p><p style="margin:18px 0 0;font-size:18px;font-weight:900">📞 Бронирование столов: <a href="{tel}" style="color:var(--gold)">{phone}</a></p>'
          if old in s:
              s = s.replace(old, new, 1)

          old2 = '<div class="actions" style="margin-top:22px"><a class="btn" href="https://yandex.ru/maps/?text=%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%B4%D0%B0%D1%80%2C%20%D0%A1%D1%83%D0%B2%D0%BE%D1%80%D0%BE%D0%B2%D0%B0%2054" target="_blank" rel="noopener">Открыть карту</a></div>'
          new2 = f'<div class="actions" style="margin-top:22px"><a class="btn" href="{tel}">📞 Позвонить</a><a class="btn ghost" href="https://yandex.ru/maps/?text=%D0%9A%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%B4%D0%B0%D1%80%2C%20%D0%A1%D1%83%D0%B2%D0%BE%D1%80%D0%BE%D0%B2%D0%B0%2054" target="_blank" rel="noopener">Открыть карту</a></div>'
          if old2 in s:
              s = s.replace(old2, new2, 1)

          s = s.replace(
            'Краснодар, ул. Суворова, 54 · 12:00–03:00</span>',
            f'Краснодар, ул. Суворова, 54 · {phone} · 12:00–03:00</span>',
            1
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add booking phone number"
          git push
