name: Link menu button
on:
  push:
    paths:
      - '.github/workflows/link-menu-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point menu buttons to menu page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="#menu">Меню</a>', 'href="menu.html">Меню</a>')
          s = s.replace('href="#menu">Открыть меню</a>', 'href="menu.html">Открыть меню</a>')
          s = s.replace('href="#menu">Посмотреть меню</a>', 'href="menu.html">Посмотреть меню</a>')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/link-menu-once.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/link-menu-once.yml
          git commit -m "Open menu page from menu buttons"
          git push
